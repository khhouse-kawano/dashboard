services:
  # ------------------------------------------------------------------
  # 既存のPHPバックエンド（現行API。設定は従来どおり）
  # ------------------------------------------------------------------
  php-web:
    build:
      context: ./backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/src:/var/www/html
    environment:
      # ローカル開発用のダミー値。漏れても実害がないため直書きしてよい。
      - DB_HOST=mariadb-db
      - DB_NAME=local_db
      - DB_USER=local_user
      - DB_PASS=local_password
      # ⚠️ core/express_proxy.php の転送先。**コンテナ名で解決する。**
      #
      #   これを設定しないと、既定値の https://api.khg-marketing.info/... を向き、
      #   **開発中の操作が本番のDBに書き込まれる。**
      #   （アンバサダー機能は Express のみで、書き込みも転送されるため）
      #
      # ⚠️ localhost ではなく express-api（サービス名）。
      #   php-web コンテナの中から見た宛先なので、localhost は自分自身になる。
      - EXPRESS_API_URL=http://express-api:3001/api/gateway
    env_file:
      # 実際に価値を持つ秘密情報（暗号化マスターキー等）はこちら。
      # このファイルは .gitignore で保護されており、Gitには入らない。
      - ./backend/.env
    depends_on:
      mariadb-db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 新規のExpress/TypeScriptバックエンド（移行先。PHPとは別ポートで並走）
  # ------------------------------------------------------------------
  express-api:
    build:
      context: ./backend-express
      # Dockerfile内の development ステージ（tsx watch でホットリロード）を使う。
      # 本番デプロイ時は target を production に変える。
      target: development
    ports:
      - "3001:3001"
    volumes:
      # ホストのソースをコンテナに同期 → 保存するだけで自動再起動される
      - ./backend-express:/app
      # ただし node_modules だけはコンテナ内のものを優先させる（匿名ボリューム）。
      # これが無いと、ホスト側の空/Windows用 node_modules で上書きされて壊れる。
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=mariadb-db
      - DB_PORT=3306
      - DB_NAME=local_db
      - DB_USER=local_user
      - DB_PASS=local_password
      # React開発サーバー(3000)とビルド確認用(3001)からのアクセスを許可
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      mariadb-db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 公開ギャラリー（K-SNAP）について
  #
  # ⚠️ このリポジトリには含まれない。別リポジトリで管理している。
  #   顧客がパスワードで入って写真を見る画面（Vite + React 19）。
  #
  #   フロント : 別リポジトリ（react/ksnap）
  #   API      : **このリポジトリ**
  #                backend/src/handlers/k-snap*.php
  #                backend-express/src/features/ksnap/
  #
  # ⚠️ k-snap* / kSnap / shop_list のレスポンスの形を変えると、
  #   別リポジトリの公開ギャラリーが壊れる。型チェックでは検出できない。
  #   詳細は ksnap/README.md を参照。
  #
  # ⚠️ 公開ギャラリー側は開発時に localhost:8080（下の php-web）を叩く。
  #   このリポジトリの php-web / mariadb-db を起動しておく必要がある。
  # ------------------------------------------------------------------

  # ------------------------------------------------------------------
  # データベース（PHP / Express の両方が同じDBを参照する）
  # ------------------------------------------------------------------
  mariadb-db:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    environment:
      - MARIADB_DATABASE=local_db
      - MARIADB_USER=local_user
      - MARIADB_PASSWORD=local_password
      - MARIADB_ROOT_PASSWORD=root_password
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    # DBが「起動した」だけでなく「接続を受け付けられる」状態になるまで待つ。
    # これが無いと、先に立ち上がったAPI側が接続エラーで落ちることがある。
    #
    # start_period は「この時間内の失敗を unhealthy とみなさない」猶予期間。
    # 空ボリュームからの初回起動では docker-entrypoint-initdb.d の初期SQL
    # （約15MB）を取り込むまで TCP 接続を受け付けず、実測で約5分かかる。
    # 短すぎると取り込み中に unhealthy 判定となり、依存サービスが起動できない。
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
    restart: unless-stopped

volumes:
  db-data:
