services:
  # ------------------------------------------------------------------
  # 既存のPHPバックエンド（現行API。設定は従来どおり）
  # ------------------------------------------------------------------
  php-web:
    build:
      context: ./backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/src:/var/www/html
    environment:
      - DB_HOST=mariadb-db
      - DB_NAME=local_db
      - DB_USER=local_user
      - DB_PASS=local_password
    depends_on:
      mariadb-db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 新規のExpress/TypeScriptバックエンド（移行先。PHPとは別ポートで並走）
  # ------------------------------------------------------------------
  express-api:
    build:
      context: ./backend-express
      # Dockerfile内の development ステージ（tsx watch でホットリロード）を使う。
      # 本番デプロイ時は target を production に変える。
      target: development
    ports:
      - "3001:3001"
    volumes:
      # ホストのソースをコンテナに同期 → 保存するだけで自動再起動される
      - ./backend-express:/app
      # ただし node_modules だけはコンテナ内のものを優先させる（匿名ボリューム）。
      # これが無いと、ホスト側の空/Windows用 node_modules で上書きされて壊れる。
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=mariadb-db
      - DB_PORT=3306
      - DB_NAME=local_db
      - DB_USER=local_user
      - DB_PASS=local_password
      # React開発サーバー(3000)とビルド確認用(3001)からのアクセスを許可
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      mariadb-db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # データベース（PHP / Express の両方が同じDBを参照する）
  # ------------------------------------------------------------------
  mariadb-db:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    environment:
      - MARIADB_DATABASE=local_db
      - MARIADB_USER=local_user
      - MARIADB_PASSWORD=local_password
      - MARIADB_ROOT_PASSWORD=root_password
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    # DBが「起動した」だけでなく「接続を受け付けられる」状態になるまで待つ。
    # これが無いと、先に立ち上がったAPI側が接続エラーで落ちることがある。
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  db-data:
