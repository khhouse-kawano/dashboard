services:
  # ------------------------------------------------------------------
  # 既存のPHPバックエンド（現行API。設定は従来どおり）
  # ------------------------------------------------------------------
  php-web:
    build:
      context: ./backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/src:/var/www/html
    environment:
      # ローカル開発用のダミー値。漏れても実害がないため直書きしてよい。
      - DB_HOST=mariadb-db
      - DB_NAME=local_db
      - DB_USER=local_user
      - DB_PASS=local_password
    env_file:
      # 実際に価値を持つ秘密情報（暗号化マスターキー等）はこちら。
      # このファイルは .gitignore で保護されており、Gitには入らない。
      - ./backend/.env
    depends_on:
      mariadb-db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 新規のExpress/TypeScriptバックエンド（移行先。PHPとは別ポートで並走）
  # ------------------------------------------------------------------
  express-api:
    build:
      context: ./backend-express
      # Dockerfile内の development ステージ（tsx watch でホットリロード）を使う。
      # 本番デプロイ時は target を production に変える。
      target: development
    ports:
      - "3001:3001"
    volumes:
      # ホストのソースをコンテナに同期 → 保存するだけで自動再起動される
      - ./backend-express:/app
      # ただし node_modules だけはコンテナ内のものを優先させる（匿名ボリューム）。
      # これが無いと、ホスト側の空/Windows用 node_modules で上書きされて壊れる。
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=mariadb-db
      - DB_PORT=3306
      - DB_NAME=local_db
      - DB_USER=local_user
      - DB_PASS=local_password
      # React開発サーバー(3000)とビルド確認用(3001)からのアクセスを許可
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      mariadb-db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 公開ギャラリー（K-SNAP）の開発サーバー
  #
  # 顧客がパスワードで入って写真を見る画面。Vite + React 19。
  # ダッシュボード（frontend/）とは別プロジェクトで、React のバージョンも違う。
  #
  # ⚠️ 本番では Docker を使わない。ビルドして ① の public_html/k-snap/ へ
  #   FTPで上げる運用。このサービスは**開発用**である。
  #
  # ⚠️ 取り込み前は開発中も本番APIを直接叩いていた。
  #   k-snap_customer_update は書き込み系なので、
  #   **開発中の操作が本番の顧客データを上書きしていた。**
  #   src/config.ts が開発時は php-web を向くようにして解消している。
  # ------------------------------------------------------------------
  ksnap-web:
    image: node:20-alpine
    working_dir: /app
    ports:
      # ⚠️ 3000 はダッシュボード、3001 は Express が使っている
      - "3002:3002"
    volumes:
      - ./ksnap-frontend:/app
      # ホストの node_modules で上書きされないようにする（匿名ボリューム）
      - /app/node_modules
    environment:
      # ⚠️ ブラウザから見た php-web のURL。コンテナ名では解決できない
      - VITE_API_BASE=http://localhost:8080/
    # ⚠️ 初回は node_modules が空なので install してから起動する。
    #   --host はコンテナ外（ホストのブラウザ）から見えるようにするため必須。
    command: sh -c "[ -d node_modules/vite ] || npm install; npm run dev -- --host 0.0.0.0 --port 3002"
    depends_on:
      - php-web
    restart: unless-stopped

  # ------------------------------------------------------------------
  # データベース（PHP / Express の両方が同じDBを参照する）
  # ------------------------------------------------------------------
  mariadb-db:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    environment:
      - MARIADB_DATABASE=local_db
      - MARIADB_USER=local_user
      - MARIADB_PASSWORD=local_password
      - MARIADB_ROOT_PASSWORD=root_password
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    # DBが「起動した」だけでなく「接続を受け付けられる」状態になるまで待つ。
    # これが無いと、先に立ち上がったAPI側が接続エラーで落ちることがある。
    #
    # start_period は「この時間内の失敗を unhealthy とみなさない」猶予期間。
    # 空ボリュームからの初回起動では docker-entrypoint-initdb.d の初期SQL
    # （約15MB）を取り込むまで TCP 接続を受け付けず、実測で約5分かかる。
    # 短すぎると取り込み中に unhealthy 判定となり、依存サービスが起動できない。
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
    restart: unless-stopped

volumes:
  db-data:
