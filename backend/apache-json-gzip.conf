# JSONレスポンスのgzip圧縮を有効にする。
#
# Debian既定の mods-enabled/deflate.conf は text/html や text/css は対象にしているが
# application/json が含まれていないため、APIのレスポンスが無圧縮のまま送られていた。
# 既定のファイルは書き換えず、対象を追加するだけにしてある（元に戻しやすくするため）。
#
# 効果の実測: customer_dataset のレスポンス 8.46MB → 約 0.76MB（約91%削減）
<IfModule mod_filter.c>
    AddOutputFilterByType DEFLATE application/json
</IfModule>
