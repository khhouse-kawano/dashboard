# =============================================================
# 本番（VPS: 162.43.5.127 / api.khg-marketing.info）用の構成。
#
# ローカル開発用の docker-compose.yml とは別ファイルにしてある。
# 中身が大きく違う（DBを持たない・TLS終端がある・SSHトンネルがある）ため、
# override で差分を当てる書き方だと、どちらの設定が効いているのか
# 読み取れなくなる。
#
# 起動:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 構成:
#   インターネット ─443→ caddy ──→ express-api ──→ ssh-tunnel ──SSH──→ エックスサーバーのMySQL
#
#   ⚠️ express-api の 3001番と ssh-tunnel の 3306番は ports に書かない。
#     書くとVPSのグローバルIPに直接口が開き、Caddy を迂回できてしまう。
#     コンテナ同士はサービス名で通信できるので公開は不要。
# =============================================================

services:
  # ------------------------------------------------------------------
  # TLS終端とリバースプロキシ
  # ------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"    # Let's Encrypt の HTTP-01 検証と、HTTPSへのリダイレクトに必要
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 取得した証明書。消すと毎回取り直しになり、Let's Encrypt の
      # レート制限（同一ドメイン週50回）に当たるおそれがある
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
    depends_on:
      - express-api
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 分析API本体
  # ------------------------------------------------------------------
  express-api:
    build:
      context: ./backend-express
      target: production
    environment:
      - NODE_ENV=production
      - PORT=3001

      # ⚠️ 必須。既定は UTC のため、指定しないと日時が9時間ずれる。
      #   PHP 側は ① レンタルサーバーのタイムゾーン（JST）で
      #   date('Y-m-d H:i:s') を書き込んでいる。合わせないと
      #   staff.timestamp や login_log の時刻が過去になり、
      #   「最終アクセス日時」「総アクセス時間」が狂う。
      - TZ=Asia/Tokyo

      # DBはSSHトンネル越し。ssh-tunnel コンテナの3306番を指す
      - DB_HOST=ssh-tunnel
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}

      # ⚠️ Caddy を1段挟むので必ず 1 にする。
      #   0 のままだと req.ip が Caddy のIPになり、
      #   レート制限が全利用者で共有され、監査ログのIPも無意味になる。
      - TRUST_PROXY=1

      # ⚠️ 分析APIだけならMCPサーバー（サーバー間通信）のみなので空でよいが、
      #   PHP互換ゲートウェイ経由でダッシュボード（ブラウザ）から叩く場合は
      #   オリジンを許可しないと全リクエストがCORSでブロックされる。
      #   .env.prod で設定する。
      - CORS_ORIGINS=${CORS_ORIGINS:-}

      # 重い集計クエリを見込む。Caddy の read_timeout より短くしておくと、
      # 超過時にExpressのJSONエラーが返る
      - REQUEST_TIMEOUT_MS=120000

      # PHP互換ゲートウェイ。未移植のリクエストの転送先（① レンタルサーバー）
      # ⚠️ ② VPS 自身のURLを設定すると無限ループになる
      - PHP_GATEWAY_URL=${PHP_GATEWAY_URL:-}
      - PHP_GATEWAY_TIMEOUT_MS=${PHP_GATEWAY_TIMEOUT_MS:-120000}
      - GATEWAY_REQUIRE_AUTH=${GATEWAY_REQUIRE_AUTH:-false}

      # メール送信（アンバサダー反響のサンクスメール・社内通知）。
      #
      # ⚠️ ① レンタルサーバーのメールアカウントで認証して送る。
      #   ② から自前の名前で送ると SPF / DKIM が合わず迷惑メールになる。
      #
      # ⚠️ **未設定なら送信をスキップする（起動は止まらない）。**
      #   設定漏れに気づかないまま「反響は保存されるがメールだけ来ない」
      #   状態になりうる。デプロイ後に必ずテスト送信で確認すること。
      #
      # ⚠️ SMTP_PASS は .env.prod にのみ書く。ここに直書きしない
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # noreply から送るため、これが無いと顧客の返信が誰にも届かない
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-}
      # 社内通知の宛先。カンマ区切りで複数可
      - AMBASSADOR_NOTIFY_TO=${AMBASSADOR_NOTIFY_TO:-}

      # イベント予約の社内通知先。
      # ⚠️ 未設定なら AMBASSADOR_NOTIFY_TO が使われる。
      - EVENT_NOTIFY_TO=${EVENT_NOTIFY_TO:-}

      # イベント受付の合い言葉。
      #
      # ⚠️⚠️ **未設定だと当日の受付が一切できない**（全リクエストが 401 になる）。
      #   素通しにはしていない。設定漏れで来場者の氏名が公開されるより、
      #   受付が動かないほうが安全という判断。
      #
      # ⚠️ 値は .env.prod にのみ書くこと。**リポジトリには書かない。**
      - EVENT_CHECKIN_PASSCODE=${EVENT_CHECKIN_PASSCODE:-}

      # 会員登録の取り込み（member_entry。GAS の MEMBERtoDashboard が送る）の合い言葉（v2.2.209）。
      #
      # ⚠️ 未設定だと全件 401（素通しにしない）。GAS は ① の予備へ送り直すが、① も同じ値でないと入らない。
      # ⚠️ GAS のスクリプト プロパティ MEMBER_ENTRY_KEY・① の環境変数と**同じ値**にすること。
      # ⚠️ 値は .env.prod にのみ書くこと。**リポジトリには書かない。**
      - MEMBER_ENTRY_KEY=${MEMBER_ENTRY_KEY:-}

      # 他社広告の取り込み（meta_scrape。拡張機能 extensions/meta が送る）の合い言葉（v2.2.230）。
      #
      # ⚠️ 未設定だと全件 401（素通しにしない）。⚠️ ② は画像を ① の meta_scrape_image へ渡すときにもこの値を付ける。
      # ⚠️ 拡張機能の config.js・① の環境変数と**同じ値**にすること。
      # ⚠️ 値は .env.prod にのみ書くこと。**リポジトリには書かない。**
      - META_SCRAPER_KEY=${META_SCRAPER_KEY:-}

      # 「Claudeによる分析」（v2.2.217）が使う Anthropic の API キー（Claude Console で発行したもの）。
      #
      # ⚠️ 未設定だと分析の開始が 503 になる（他の機能は動く）。
      # ⚠️ 値は .env.prod にのみ書くこと。**リポジトリには書かない。** 差し替え手順は docs/deploy-v2.2.217.md
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # K-SNAP の owner を公開ギャラリー向けに暗号化する鍵。
      #
      # ⚠️ ① の .htaccess（SetEnv）と**同じ値**にすること。
      #   異なると暗号文が変わり、owner による絞り込みが ① 経由と ② 経由で
      #   食い違う。値を変えると既存の暗号文とも一致しなくなる。
      #
      # ⚠️ 未設定だと owner を空文字で返す（平文は返さない）。
      #   起動ログではなく、リクエスト時に error ログが出る。
      - KSNAP_OWNER_KEY=${KSNAP_OWNER_KEY:-}
      - KSNAP_OWNER_IV=${KSNAP_OWNER_IV:-}

      # 広告流入の着地記録で IP をハッシュにするソルト（v2.2.199）。
      #
      # ⚠️ 値は .env.prod にのみ書くこと。**リポジトリには書かない。**
      # ⚠️ 一度決めたら変えない（変えると同じ IP でも別のハッシュになる）。
      # ⚠️ 未設定でも動く（ip_hash が NULL になるだけ）。
      - TRACKING_IP_SALT=${TRACKING_IP_SALT:-}

      # Meta 広告（自社）の成果の取り込み（v2.2.203。features/metaAds/）。
      #
      # ⚠️ 値は .env.prod にのみ書くこと。**リポジトリには書かない。**
      # ⚠️ META_ACCESS_TOKEN：システムユーザーのトークン（権限 ads_read）。
      # ⚠️ META_AD_ACCOUNTS：「ブランドキー:キャンペーンID」をカンマでつなぐ（例 kh:120202114039520198,djh:120242527269730489）。
      # ⚠️ どちらかが空なら取り込みをしない（起動は止まらない。アクセス解析の Meta の数字が出ないだけ）。
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_AD_ACCOUNTS=${META_AD_ACCOUNTS:-}
    depends_on:
      ssh-tunnel:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------------------------------
  # エックスサーバーのMySQLへのSSHトンネル
  #
  # ⚠️ 事前準備（VPS側）
  #   1. ssh-keygen -t ed25519 で鍵を作り、公開鍵をエックスサーバーの
  #      サーバーパネル「SSH設定」に登録する
  #   2. 秘密鍵を ./secrets/id_ed25519 に置き chmod 600
  #   3. ssh-keyscan -p 10022 <SSH_HOST> > ./secrets/known_hosts
  #      （StrictHostKeyChecking=yes のため、事前に登録が要る。
  #        ここを no にすると中間者攻撃を検知できなくなるので必ず登録する）
  # ------------------------------------------------------------------
  ssh-tunnel:
    build:
      context: ./docker/ssh-tunnel
    environment:
      - SSH_HOST=${SSH_HOST}
      - SSH_PORT=${SSH_PORT:-10022}
      - SSH_USER=${SSH_USER}
      - REMOTE_DB_HOST=${REMOTE_DB_HOST}
      - REMOTE_DB_PORT=${REMOTE_DB_PORT:-3306}
    volumes:
      - ./secrets/id_ed25519:/home/tunnel/.ssh/id_ed25519:ro
      - ./secrets/known_hosts:/home/tunnel/.ssh/known_hosts:ro
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
